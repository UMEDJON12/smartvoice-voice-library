name: Inspect voice archives without publishing
on:
  push:
    branches: [main]
    paths: ['tools/inspect_archives.py', '.github/workflows/inspect.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate private draft archives without publishing them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/inspect_archives.py
      - name: Save inspection report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add checks/archive-inspection.json
          git diff --cached --quiet || git commit -m "Record structural inspection of voice archives"
          git push
