name: Update SmartVoice voice catalog
on:
  release:
    types: [published, edited]
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['metadata-overrides.json', 'tools/**', 'samples/**', '.github/workflows/catalog.yml', '.github/workflows/catalog-release.yml']
permissions:
  contents: write
concurrency:
  group: voice-catalog-main
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare the audio sample encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Check catalog rules and non-forced main publication
        run: |
          python3 tools/test_catalog.py
          python3 tools/test_publish_catalog.py
          python3 tools/test_validator_diagnostics.py
      - name: Validate archives and save verified catalog to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMARTVOICE_SAMPLES: '1'
        run: python3 tools/publish_catalog.py
