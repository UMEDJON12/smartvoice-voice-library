name: Update SmartVoice voice catalog
on:
  release:
    types: [published, edited]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['metadata-overrides.json', 'tools/**', '.github/workflows/catalog.yml']
permissions:
  contents: write
concurrency:
  group: voice-catalog
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect archives with the existing SmartVoice importer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build_catalog.py
      - name: Save only the verified catalog and review reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json checks/archive-inspection.json checks/needs-review.json
          git diff --cached --quiet || git commit -m "Update verified SmartVoice voice catalog"
          git push
