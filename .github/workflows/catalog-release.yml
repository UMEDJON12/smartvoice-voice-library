# The old release tag is immutable. Intercept its request using default-branch
# code before it downloads archives. Completed failures remain a recovery path.
name: Route voice release to current main
on:
  workflow_run:
    workflows: ['Update SmartVoice voice catalog']
    types: [requested, completed]
permissions:
  contents: write
  actions: write
jobs:
  route:
    if: >-
      github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.action == 'requested' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      forward: ${{ steps.route.outputs.forward }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: route
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/forward_release.py
  refresh:
    needs: route
    if: needs.route.outputs.forward == 'true'
    uses: ./.github/workflows/catalog.yml
